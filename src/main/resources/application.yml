# Settings for local testing
server.port: 8081

server:
  error:
    include-message: always            # with on_param only shown when using 'message' option
    include-stacktrace: on_param       # with on_param only shown when using 'trace' option
    include-exception: true
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      enabled: true
      location: ${java.io.tmpdir}
      max-file-size: 8MB
      max-request-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: info, health

  info:
    env:
      enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      # We simplify the groups to use standard, built-in states
      group:
        liveness:
          include: livenessState
          show-details: always
        readiness:
          include: readinessState
          show-details: always

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true